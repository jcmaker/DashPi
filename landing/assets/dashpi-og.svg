  <text x="72" y="338" fill="#fbfbfd" font-family="Arial, Helvetica, sans-serif" font-size="86" font-weight="800" letter-spacing="-4">ACCIDENT EVIDENCE.</text>
  <text x="72" y="438" fill="#fbfbfd" font-family="Arial, Helvetica, sans-serif" font-size="86" font-weight="800" letter-spacing="-4">OFFLINE FIRST.</text>
