  <rect width="1200" height="630" fill="#111216"/>
  <path d="M72 148H1128" stroke="#35363b" stroke-width="2"/>
  <text x="72" y="112" fill="#fbfbfd" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="800" letter-spacing="-5">dashpi</text>
  <rect x="278" y="66" width="36" height="36" fill="#c9342d"/>
  <circle cx="1092" cy="92" r="9" fill="#c9342d"/>
