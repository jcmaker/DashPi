name: Deploy landing page and receiver

on:
  push:
    branches: [main]
    paths:
      - landing/**
      - tests/test_landing.py
      - receiver-app/**
      - receiver-native/**
      - web/src/optical/**
      - tests/fixtures/optical-e2e.json
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify landing page
        run: python -m unittest discover -s tests -p 'test_landing.py'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: receiver-app/package-lock.json
      - name: Test and build receiver
        working-directory: receiver-app
        run: |
          npm ci
          npm test
          npm run build
      - name: Assemble site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir _site
          cp -R landing/. _site/
          cp -R receiver-app/dist _site/receiver
          # Serve the newest signed app release (built by android-release.yml) at /receiver/DashPi.apk.
          tag=$(gh release list --limit 30 --json tagName,isDraft,isPrerelease \
            --jq '[.[] | select(.tagName | startswith("app-v")) | select((.isDraft or .isPrerelease) | not)][0].tagName // empty')
          test -n "$tag" || { echo "::error::no app-v* release to serve; push an app-v tag first"; exit 1; }
          gh release download "$tag" --pattern DashPi.apk --dir _site/receiver
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
