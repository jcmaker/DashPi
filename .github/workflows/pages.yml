name: Deploy landing page and receiver

on:
  push:
    branches: [main]
    paths:
      - landing/**
      - tests/test_landing.py
      - scripts/select_landing_apk.py
      - receiver-app/**
      - receiver-native/**
      - web/src/optical/**
      - tests/fixtures/optical-e2e.json
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify landing page
        run: python -m unittest discover -s tests -p 'test_landing.py'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: receiver-app/package-lock.json
      - name: Test and build receiver
        working-directory: receiver-app
        run: |
          npm ci
          npm test
          npm run build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools build-tools;35.0.0
      - name: Assemble site
        env:
          GH_TOKEN: ${{ github.token }}
          # Same upload certificate android-release.yml pins. Any other signer fails this job.
          EXPECTED_CERT_SHA256: a2580d9c7a94d086113cb23a1abe5e665e39b64d9cca6a5b50eb105eb1e35d77
        run: |
          mkdir _site
          cp -R landing/. _site/
          cp -R receiver-app/dist _site/receiver
          # Highest stable app-v* that has DashPi.apk, not the newest-created tag.
          tag=$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" | python scripts/select_landing_apk.py)
          apk_dir="${RUNNER_TEMP}/landing-apk"
          mkdir -p "$apk_dir"
          gh release download "$tag" --pattern DashPi.apk --dir "$apk_dir"
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$apksigner" verify --print-certs "$apk_dir/DashPi.apk" | tee "$RUNNER_TEMP/certs.txt"
          actual=$(grep -m1 'SHA-256 digest' "$RUNNER_TEMP/certs.txt" | awk '{print $NF}')
          test "$actual" = "$EXPECTED_CERT_SHA256" || { echo "::error::APK signed with $actual, expected $EXPECTED_CERT_SHA256"; exit 1; }
          cp "$apk_dir/DashPi.apk" _site/receiver/DashPi.apk
          printf '{"version":"%s"}\n' "${tag#app-v}" > _site/receiver/version.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
